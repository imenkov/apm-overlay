name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install click pyyaml

      - name: Validate CLI
        run: |
          python tools/apm-overlay --version
          python tools/apm-overlay --help
          APM_OVERLAYS_DIR="$PWD/overlays" python tools/apm-overlay list
          python -m unittest discover -s tests -v

      - name: Check for private/internal references
        run: |
          ! grep -RInE 'agency-microsoft|microsoft\\.com|@microsoft|\\.windows\\.net' \
            --exclude-dir=.git \
            --exclude-dir=apm_modules \
            --exclude-dir=.agents \
            --exclude=ci.yml \
            .
